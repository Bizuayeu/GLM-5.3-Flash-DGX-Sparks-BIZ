name: CPU checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The 1.x line; the 2.x and 3.x steps below name v2/ and v3/.
        working-directory: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # The check tools at the checkout root, then 1.x's test dependencies.
      - run: python -m pip install -r ../requirements/dev.lock.txt -r requirements/test.lock.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: ruff check glm53_setup tests tools
      - run: ruff format --check glm53_setup tests tools
      # The repository tools and the host tools at the checkout root; the host tools
      # have no extension, so ruff is given them by name.
      - run: python -m unittest discover -s tests -t . -v
        working-directory: .
      - run: ruff check tools tests host/nccl_probe.py host/gb10-telemetry host/cool-gate host/thermal-watch
        working-directory: .
      - run: ruff format --check tools tests host/nccl_probe.py host/gb10-telemetry host/cool-gate host/thermal-watch
        working-directory: .
      - run: python tools/check_publication.py
        working-directory: .
      - run: python -m unittest discover -s tests -t . -v
        working-directory: v2
      - run: ruff check glm53_tf tests
        working-directory: v2
      - run: ruff format --check glm53_tf tests
        working-directory: v2
      - run: python -m unittest discover -s tests -t . -v
        working-directory: v3
      - run: ruff check glm53_tf tests
        working-directory: v3
      - run: ruff format --check glm53_tf tests
        working-directory: v3

  cpu-torch:
    # Optional: 1.x's tests that need torch but no GPU, with torch built for CPU. It does not
    # gate a merge, since it depends on PyTorch's package index; the CUDA and pinned-vLLM tests
    # still skip here.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/test.lock.txt
      - run: python -m pip install -r requirements/cpu-torch.lock.txt
      - run: python -m unittest discover -s tests -t . -v
